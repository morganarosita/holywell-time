<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
}

/* Notion's iframe becomes the viewport */
#viewport {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
}

/*
   CARD WRAPPER

   Keeps a 2:1 aspect ratio (matching the weather card) and
   scales to fit the viewport without ever cropping.
   container-type lets children use cqw units, which are
   percentages of THIS element's own box.
*/
#card-wrapper {
    width: min(100%, 200vh);
    aspect-ratio: 2 / 1;
    container-type: inline-size;
}

/* ==============================
   GREETING CARD
================================ */

.greeting-card {
    width: 100%;
    height: 100%;

    background: #EAF1EE;

    border-radius: 5cqw;

    padding: 5cqh 6.3cqw;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    color: #26312F;

    overflow: hidden;

    display: flex;
    flex-direction: column;
    justify-content: center;
}

.greeting-line {
    font-size: 4cqw;
    line-height: 5cqw;

    color: #26312F;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;

    margin-bottom: 1.3cqw;
}

.wave {
    display: inline-block;
    margin-left: 0.3cqw;
}

.time {
    font-size: 12.7cqw;
    line-height: 11.7cqw;

    font-weight: 600;

    letter-spacing: -0.4cqw;

    white-space: nowrap;
}
</style>
</head>

<body>

<div id="viewport">

    <div id="card-wrapper">

        <div class="greeting-card">

            <div class="greeting-line" id="greeting">
                Good afternoon, <span class="wave">👋</span>
            </div>

            <div class="time" id="time">
                --:--
            </div>

        </div>

    </div>

</div>


<script>

/* ==================================================
   GREETING + TIME

   Timezone is detected from the viewer's IP address
   (like the weather widget does for location), NOT from
   the device's OS clock setting - so it reflects where
   the connection is actually coming from, including
   through a VPN.
================================================== */

let currentTimeZone = null;


async function detectTimeZone() {

    try {

        const response =
            await fetch(
                "https://ipapi.co/json/"
            );


        if (!response.ok) {
            throw new Error(
                "Timezone lookup unavailable"
            );
        }


        const data =
            await response.json();


        currentTimeZone =
            data.timezone ||
            Intl.DateTimeFormat()
                .resolvedOptions()
                .timeZone;


    } catch (error) {

        console.error(error);

        /* Fall back to the device's own timezone
           if the IP lookup fails */

        currentTimeZone =
            Intl.DateTimeFormat()
                .resolvedOptions()
                .timeZone;

    }

}


function greetingForHour(hour) {

    if (hour >= 5 && hour < 12) {
        return "Good morning";
    }

    if (hour >= 12 && hour < 17) {
        return "Good afternoon";
    }

    return "Good evening";

}


function updateClock() {

    if (!currentTimeZone) {
        return;
    }

    const now = new Date();


    const hour =
        parseInt(
            new Intl.DateTimeFormat(
                "en-US",
                {
                    hour: "numeric",
                    hour12: false,
                    timeZone: currentTimeZone
                }
            ).format(now),
            10
        );


    const greetingText =
        greetingForHour(hour);


    document.getElementById(
        "greeting"
    ).innerHTML =
        `${greetingText}, <span class="wave">👋</span>`;


    const timeText =
        now.toLocaleTimeString(
            "en-US",
            {
                hour: "numeric",
                minute: "2-digit",
                hour12: true,
                timeZone: currentTimeZone
            }
        );


    document.getElementById(
        "time"
    ).textContent = timeText;

}


/* ==================================================
   START
================================================== */

async function init() {

    await detectTimeZone();

    updateClock();

}


init();


/* Update the displayed clock every 10 seconds */

setInterval(
    updateClock,
    10 * 1000
);


/* Re-check the IP-based timezone every 10 minutes,
   in case the connection location changes */

setInterval(
    detectTimeZone,
    10 * 60 * 1000
);

</script>

</body>
</html>
